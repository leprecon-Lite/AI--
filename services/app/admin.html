<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — AI Quality Agent</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f7f4ef;
      color: #2b2b2b;
    }

    header.site-header {
      background: #f7f4ef;
      border-bottom: 1px solid #eadfce;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      gap: 40px;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #f15a24;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo::before { content: "●"; color: #f15a24; font-size: 26px; }
    nav.site-nav { display: flex; gap: 28px; font-size: 14px; color: #3d3d3d; }
    nav.site-nav a {
      color: #3d3d3d; text-decoration: none;
      transition: color .15s;
    }
    nav.site-nav a:hover, nav.site-nav a.active { color: #f15a24; }

    .page-title {
      background: #f7f4ef;
      padding: 20px 40px 0;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    .page-title h1 { font-size: 24px; margin: 0; }
    .page-title .subtitle { color: #8a7a5c; font-size: 14px; }

    .tabs {
      background: #f7f4ef;
      border-bottom: 1px solid #eadfce;
      padding: 16px 40px 0;
      display: flex;
      gap: 8px;
    }
    .tab {
      padding: 10px 20px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      color: #6a6a6a;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      transition: all .15s;
    }
    .tab:hover { color: #f15a24; }
    .tab.active {
      color: #f15a24;
      border-bottom-color: #f15a24;
    }

    .container {
      max-width: 1200px;
      margin: 24px auto 60px;
      padding: 0 40px;
    }

    /* ---------- Карточки статистики ---------- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #fff;
      border: 1px solid #eadfce;
      border-radius: 12px;
      padding: 20px 24px;
    }
    .stat-label { font-size: 13px; color: #8a7a5c; text-transform: uppercase; letter-spacing: .04em; }
    .stat-value { font-size: 32px; font-weight: 700; margin-top: 6px; }
    .stat-card.good .stat-value    { color: #3fa34d; }
    .stat-card.warning .stat-value { color: #f1a208; }
    .stat-card.defect .stat-value  { color: #c0392b; }

    /* ---------- Таблицы ---------- */
    .card {
      background: #fff;
      border: 1px solid #eadfce;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background: #faf7f2;
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      color: #6a6a6a;
      text-transform: uppercase;
      letter-spacing: .05em;
      border-bottom: 1px solid #eadfce;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #f1eadc;
      font-size: 14px;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fdfaf6; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-good    { background: #e7f5e9; color: #2f7d3c; }
    .badge-warning { background: #fef8e6; color: #8a6400; }
    .badge-defect  { background: #fde9e7; color: #8b2c20; }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .filter-btn {
      padding: 6px 14px;
      background: #fff;
      border: 1px solid #eadfce;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      color: #3d3d3d;
    }
    .filter-btn:hover { border-color: #f15a24; color: #f15a24; }
    .filter-btn.active { background: #f15a24; color: #fff; border-color: #f15a24; }

    .code {
      font-family: "SF Mono", Consolas, monospace;
      font-size: 12px;
      background: #faf7f2;
      padding: 2px 6px;
      border-radius: 4px;
      color: #8a6400;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #8a7a5c;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #8a7a5c;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="logo">СОЛЯРИС</div>
    <nav class="site-nav">
      <a href="/">Проверка качества</a>
      <a href="/admin" class="active">Админ-панель</a>
    </nav>
  </header>

  <div class="page-title">
    <h1>Панель администратора</h1>
    <span class="subtitle">Управление проверками и нормативами</span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('stats', this)">📊 Статистика</button>
    <button class="tab" onclick="showTab('protocols', this)">📋 История проверок</button>
    <button class="tab" onclick="showTab('rules', this)">📖 Нормативы</button>
    <button class="tab" onclick="showTab('config', this)">⚙️ Настройки</button>
  </div>

  <div class="container">
    <div id="panel-stats"></div>
    <div id="panel-protocols" style="display:none;"></div>
    <div id="panel-rules" style="display:none;"></div>
    <div id="panel-config" style="display:none;"></div>
  </div>

  <script>
    const loaded = { stats: false, protocols: false, rules: false, config: false };

    function showTab(name, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');

      ['stats', 'protocols', 'rules', 'config'].forEach(t => {
        document.getElementById('panel-' + t).style.display = (t === name) ? 'block' : 'none';
      });

      if (!loaded[name]) {
        loaded[name] = true;
        loadTab(name);
      }
    }

    function loadTab(name) {
      const panel = document.getElementById('panel-' + name);
      panel.innerHTML = '<div class="loading">⏳ Загрузка…</div>';

      if (name === 'stats') {
        fetch('/admin/api/stats').then(r => r.json()).then(renderStats);
      } else if (name === 'protocols') {
        loadProtocols('');
      } else if (name === 'rules') {
        fetch('/admin/api/rules').then(r => r.json()).then(renderRules);
      } else if (name === 'config') {
        fetch('/admin/api/config').then(r => r.json()).then(renderConfig);
      }
    }

    // ============== СТАТИСТИКА ==============
    function renderStats(data) {
      if (data.error) {
        document.getElementById('panel-stats').innerHTML = '<div class="card"><p style="color:#c0392b">' + data.error + '</p></div>';
        return;
      }

      let html = '<div class="stats-grid">';
      html += '<div class="stat-card"><div class="stat-label">Всего проверок</div><div class="stat-value">' + data.total + '</div></div>';
      html += '<div class="stat-card good"><div class="stat-label">🟢 Годно</div><div class="stat-value">' + data.good + '</div></div>';
      html += '<div class="stat-card warning"><div class="stat-label">🟡 Требует внимания</div><div class="stat-value">' + data.warning + '</div></div>';
      html += '<div class="stat-card defect"><div class="stat-label">🔴 Брак</div><div class="stat-value">' + data.defect + '</div></div>';
      html += '</div>';

      // Топ проблемных параметров
      if (data.top_fails && data.top_fails.length > 0) {
        html += '<div class="card"><h3 class="card-title">Топ-5 параметров, чаще всего вызывающих брак</h3>';
        html += '<table><thead><tr><th>Параметр</th><th>Кол-во браковок</th></tr></thead><tbody>';
        data.top_fails.forEach(function(f) {
          html += '<tr><td>' + f.parameter + '</td><td><b>' + f.count + '</b></td></tr>';
        });
        html += '</tbody></table></div>';
      }

      // Динамика по дням
      if (data.by_day && data.by_day.length > 0) {
        html += '<div class="card"><h3 class="card-title">Активность за последние дни</h3>';
        html += '<table><thead><tr><th>Дата</th><th>Проверок</th></tr></thead><tbody>';
        data.by_day.forEach(function(d) {
          html += '<tr><td>' + d.date + '</td><td>' + d.count + '</td></tr>';
        });
        html += '</tbody></table></div>';
      }

      document.getElementById('panel-stats').innerHTML = html;
    }

    // ============== ИСТОРИЯ ==============
    function loadProtocols(status) {
      document.querySelectorAll('#panel-protocols .filter-btn').forEach(b => b.classList.remove('active'));
      const btn = document.querySelector('#panel-protocols .filter-btn[data-status="' + status + '"]');
      if (btn) btn.classList.add('active');

      const panel = document.getElementById('panel-protocols');
      if (!panel.querySelector('.filter-bar')) {
        panel.innerHTML = '<div class="filter-bar">' +
          '<button class="filter-btn active" data-status="" onclick="loadProtocols(\'\')">Все</button>' +
          '<button class="filter-btn" data-status="good" onclick="loadProtocols(\'good\')">🟢 Годно</button>' +
          '<button class="filter-btn" data-status="warning" onclick="loadProtocols(\'warning\')">🟡 Внимание</button>' +
          '<button class="filter-btn" data-status="defect" onclick="loadProtocols(\'defect\')">🔴 Брак</button>' +
          '</div><div id="protocols-list"><div class="loading">⏳ Загрузка…</div></div>';
      } else {
        document.getElementById('protocols-list').innerHTML = '<div class="loading">⏳ Загрузка…</div>';
      }

      fetch('/admin/api/protocols?status=' + status + '&limit=50')
        .then(r => r.json())
        .then(renderProtocols);
    }

    function renderProtocols(data) {
      const list = document.getElementById('protocols-list');
      if (data.error) {
        list.innerHTML = '<div class="card"><p style="color:#c0392b">' + data.error + '</p></div>';
        return;
      }
      if (!data.items || data.items.length === 0) {
        list.innerHTML = '<div class="card"><div class="empty">Проверок пока нет. Загрузите файл на странице проверки.</div></div>';
        return;
      }

      let html = '<div class="card"><table><thead><tr>' +
        '<th>№</th><th>Файл</th><th>Дата</th><th>Строк</th><th>Брак</th><th>Внимание</th><th>Статус</th>' +
        '</tr></thead><tbody>';

      data.items.forEach(function(p) {
        const badge = p.overall_status;
        html += '<tr>' +
          '<td><b>' + p.id + '</b></td>' +
          '<td>' + p.filename + '</td>' +
          '<td>' + (p.uploaded_at || '').slice(0, 19).replace('T', ' ') + '</td>' +
          '<td>' + p.total_rows + '</td>' +
          '<td>' + p.failed_rows + '</td>' +
          '<td>' + p.warning_rows + '</td>' +
          '<td><span class="badge badge-' + badge + '">' + badge + '</span></td>' +
          '</tr>';
      });

      html += '</tbody></table></div>';
      list.innerHTML = html;
    }

    // ============== НОРМАТИВЫ ==============
    function renderRules(data) {
      const panel = document.getElementById('panel-rules');
      if (data.error) {
        panel.innerHTML = '<div class="card"><p style="color:#c0392b">' + data.error + '</p></div>';
        return;
      }

      let html = '<div class="card"><h3 class="card-title">Нормативы ГОСТ 32775—2014 (' + data.total + ' пунктов)</h3>';
      html += '<table><thead><tr><th>ID</th><th>Пункт</th><th>Параметр</th><th>Оператор</th><th>Значение</th><th>Ед.</th></tr></thead><tbody>';

      data.items.forEach(function(r) {
        let valDisplay = '';
        if (r.operator === 'от ... до' && typeof r.value === 'object' && r.value) {
          valDisplay = r.value.min + '…' + r.value.max;
        } else if (r.value !== null && r.value !== undefined) {
          valDisplay = String(r.value).slice(0, 40);
        }
        html += '<tr>' +
          '<td><span class="code">' + r.id + '</span></td>' +
          '<td>' + (r.clause || '') + '</td>' +
          '<td>' + (r.parameter || '') + '</td>' +
          '<td>' + (r.operator || '') + '</td>' +
          '<td>' + valDisplay + '</td>' +
          '<td>' + (r.unit || '') + '</td>' +
          '</tr>';
      });

      html += '</tbody></table></div>';
      panel.innerHTML = html;
    }

    // ============== НАСТРОЙКИ ==============
    function renderConfig(data) {
      const panel = document.getElementById('panel-config');
      if (data.error) {
        panel.innerHTML = '<div class="card"><p style="color:#c0392b">' + data.error + '</p></div>';
        return;
      }

      let html = '<div class="card"><h3 class="card-title">Текущие настройки</h3><table>';
      html += '<tr><td>Модель GigaChat</td><td><span class="code">' + data.giga_model + '</span></td></tr>';
      html += '<tr><td>Scope</td><td><span class="code">' + data.giga_scope + '</span></td></tr>';
      html += '<tr><td>Tolerance (%)</td><td><span class="code">' + data.warning_tolerance_percent + '</span></td></tr>';
      html += '<tr><td>Уровень логирования</td><td><span class="code">' + data.log_level + '</span></td></tr>';
      html += '<tr><td>Файл нормативов</td><td><span class="code">' + data.rules_path + '</span></td></tr>';
      html += '<tr><td>Файл БД</td><td><span class="code">' + data.db_path + '</span></td></tr>';
      html += '</table></div>';

      html += '<div class="card"><p style="color:#8a7a5c; font-size: 14px;">' +
        'Настройки задаются в <span class="code">.env</span> и в <span class="code">services/llm-gigachat/config.py</span>. ' +
        'Изменения применяются после перезапуска контейнера.' +
        '</p></div>';

      panel.innerHTML = html;
    }

    // Загружаем статистику по умолчанию
    loadTab('stats');
  </script>

</body>
</html>
